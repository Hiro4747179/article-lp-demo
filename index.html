<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>記事型LPテンプレート</title>
  <link rel="stylesheet" href="style.css" />

  <!-- ✅ Google Tag Manager（head） -->

    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;
    j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
    f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NZ7NN2QD');
  </script>
  <!-- End Google Tag Manager -->
</head>
<body>

  <!-- ✅ Google Tag Manager（noscript） -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NZ7NN2QD"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager -->

  <!-- ファーストビュー -->
  <header>
    <h1>フォーム離脱を防ぐ新しいアプローチ</h1>
    <p>ユーザー体験を向上させ、コンバージョン率を高める方法をご紹介します。</p>
  </header>

  <!-- 問題提起 -->
  <section id="problem">
    <h2>こんなお悩みありませんか？</h2>
    <ul>
      <li>フォーム入力中にユーザーが離脱してしまう</li>
      <li>入力項目が多く、完了率が低い</li>
      <li>ユーザーからの問い合わせが減少している</li>
    </ul>
  </section>

  <!-- 解決策の提示 -->
  <section id="solution">
    <h2>チャット型フォームで解決</h2>
    <p>従来のフォームをチャット形式に変えることで、ユーザーの入力負担を軽減し、離脱率を低下させます。</p>
  </section>

  <!-- 導入事例や実績 -->
  <section id="case-study">
    <h2>導入事例</h2>
    <p>ある企業では、チャット型フォームを導入した結果、コンバージョン率が1.5倍に向上しました。</p>
  </section>

  <!-- CTA -->
  <section id="cta">
    <h2>今すぐ体験してみる</h2>
    <a href="#" class="cta-button" id="cta-button">無料デモを試す</a>
  </section>

  <footer>
    <p>&copy; 2025 会社名</p>
  </footer>

  <!-- ✅ BOTCHAN起動処理（efoInit） -->
  <script>
    function waitForEfoInit(callback, interval = 500, timeout = 15000) {
      const start = Date.now();
      const timer = setInterval(() => {
        if (typeof efoInit === "function") {
          clearInterval(timer);
          callback();
        } else if (Date.now() - start > timeout) {
          clearInterval(timer);
          console.error("❌ efoInit が読み込まれませんでした");
        }
      }, interval);
    }

    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(function () {
        waitForEfoInit(function () {
          console.log("✅ BOTCHAN init 実行（efoInit）");

          efoInit("686b94425bab4156450213d9", {
            autoStart: false,
            onReady: function (efoApp) {
              const ctaButton = document.getElementById("cta-button");
              if (ctaButton) {
                ctaButton.addEventListener("click", function (e) {
                  e.preventDefault();
                  efoApp.open();
                });
              } else {
                console.warn("❗CTAボタンが見つかりません");
              }
            }
          });
        });
      }, 5000); // ← 初期実行を5秒遅らせます
    });
  </script>

</body>
</html>
