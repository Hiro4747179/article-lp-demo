<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>記事型LPテンプレート</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ファーストビュー -->
  <header>
    <h1>フォーム離脱を防ぐ新しいアプローチ</h1>
    <p>ユーザー体験を向上させ、コンバージョン率を高める方法をご紹介します。</p>
  </header>

  <!-- 問題提起 -->
  <section id="problem">
    <h2>こんなお悩みありませんか？</h2>
    <ul>
      <li>フォーム入力中にユーザーが離脱してしまう</li>
      <li>入力項目が多く、完了率が低い</li>
      <li>ユーザーからの問い合わせが減少している</li>
    </ul>
  </section>

  <!-- 解決策の提示 -->
  <section id="solution">
    <h2>チャット型フォームで解決</h2>
    <p>従来のフォームをチャット形式に変えることで、ユーザーの入力負担を軽減し、離脱率を低下させます。</p>
  </section>

  <!-- 導入事例や実績 -->
  <section id="case-study">
    <h2>導入事例</h2>
    <p>ある企業では、チャット型フォームを導入した結果、コンバージョン率が1.5倍に向上しました。</p>
  </section>

  <!-- CTA -->
  <section id="cta">
    <h2>今すぐ体験してみる</h2>
    <a href="#" class="cta-button" id="cta-button">無料デモを試す</a>
  </section>

  <footer>
    <p>&copy; 2025 会社名</p>
  </footer>

  <!-- BOTCHANスクリプトの読み込みと初期化 -->
  <script>
    const botScript = document.createElement("script");
    botScript.src = "https://app2.blob.core.windows.net/botchan/js/efoapp.js";

    botScript.onload = function () {
      console.log("BOTCHANスクリプト読み込み完了");

      if (typeof efoInit === "function") {
        console.log("efoInitを呼び出します");
        efoInit("686b94425bab4156450213d9", { autoStart: false });

        const ctaBtn = document.getElementById("cta-button");
        if (ctaBtn) {
          ctaBtn.addEventListener("click", function (e) {
            e.preventDefault();
            if (window.efo && typeof window.efo.open === "function") {
              console.log("BOTを手動起動します");
              window.efo.open();
            } else {
              console.warn("window.efo.open() がまだ定義されていません");
            }
          });
        }
      } else {
        console.error("efoInitが存在しません。スクリプトが正しく読み込まれていない可能性があります。");
      }
    };

    botScript.onerror = function () {
      console.error("BOTCHANスクリプトの読み込みに失敗しました");
    };

    document.head.appendChild(botScript);
  </script>

</body>
</html>
